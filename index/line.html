<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me on LINE</title>
  <meta name="description" content="Get in touch on LINE." />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#f2f2f2;font-family:system-ui,sans-serif}
    .card{max-width:380px;margin:24px;padding:32px 24px;text-align:center;background:#181818;border-radius:20px}
    .avatar{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:#06c755;color:#fff;display:grid;place-items:center}
    h1{font-size:1.5rem;margin:0 0 12px}
    p{color:#bbb;line-height:1.6;margin:0 0 20px}
    .line-button{display:inline-flex;gap:10px;align-items:center;padding:14px 24px;background:#06c755;color:#fff;font-weight:600;text-decoration:none;border-radius:999px}
    .line-icon{font-size:.75rem;background:#fff;color:#06c755;padding:2px 6px;border-radius:6px;font-weight:800}
    .hint{font-size:.8rem;margin:16px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.02 2 11c0 2.85 1.53 5.4 3.94 7.1-.15.9-.55 2.3-1.2 3.6a.5.5 0 0 0 .63.68c1.63-.6 3.1-1.5 4-2.13.83.19 1.7.29 2.63.29 5.52 0 10-4.02 10-9S17.52 2 12 2z"/>
      </svg>
    </div>
    <h1>Let's Chat on LINE</h1>
    <p>Have a question or want to book? Message me directly and I'll reply as soon as I can.</p>
    <a class="line-button" href="https://line.me/ti/p/~weya.exe" target="_blank" rel="noopener noreferrer">
      <span class="line-icon" aria-hidden="true">LINE</span>
      Contact Me on LINE
    </a>
    <p class="hint">Opens the LINE app or line.me in a new tab.</p>
  </main>
</body>
</html>
